name: clarvio-mail-local
services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .local/database.env
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - mail-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarvio_mail -d clarvio_mail"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  mail-data:
