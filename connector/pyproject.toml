[project]
name = "clarvio-mail-mcp"
version = "1.0.0"
description = "Stateless Clarvio Mail MCP connector for Clarvio Agent"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp==2.2.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
